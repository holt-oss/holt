# Holt production stack at https://githolt.com (compose project holt-prod).
#
# Run it through deploy.sh, never by hand with `compose up`: deploy.sh sets
# HOLT_SRC (a clone checked out at origin/main) and HOLT_TAG (that commit's
# SHA, the image tag), reads ~/.config/holt/secrets.env, and rolls back when
# the health check fails. Only the edge publishes a port, on 127.0.0.1, and
# the Cloudflare tunnel (see TUNNEL.md) is the one public way in.
#
#   tunnel -> edge (nginx, /__build, www redirect) -> web (Next.js) -> server (FastAPI) -> db
#
# Secrets come from ~/.local/share/holt-prod/.env (make-env.sh writes it;
# deploy.sh passes it with --env-file). Nothing here auto-updates.
#
# HOLT_PROD_PROJECT (default holt-prod) names the project, the images and
# the label, so a rehearsal under another name (README.md) can never touch
# the real stack's containers or images.
name: ${HOLT_PROD_PROJECT:-holt-prod}

x-prod-label: &prod-label
  holt.stack: ${HOLT_PROD_PROJECT:-holt-prod}

services:
  db:
    image: postgres:16-alpine
    labels: *prod-label
    environment:
      POSTGRES_USER: holt
      POSTGRES_PASSWORD: ${HOLT_DB_PASSWORD:?run make-env.sh}
      POSTGRES_DB: holt
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=40"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holt -d holt"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    restart: unless-stopped

  # One-shot: applies web/drizzle/*.sql (Auth.js tables) to holt_web, each
  # file once, then exits. deploy.sh runs it before swapping the containers.
  migrate-web:
    image: postgres:16-alpine
    labels: *prod-label
    profiles: [migrate]
    environment:
      PGHOST: db
      PGUSER: holt
      PGPASSWORD: ${HOLT_DB_PASSWORD}
      PGDATABASE: holt_web
    volumes:
      - ${HOLT_SRC:?set by deploy.sh}/web/drizzle:/migrations:ro
      - ./migrate-web.sh:/migrate-web.sh:ro
    entrypoint: ["sh", "/migrate-web.sh"]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 64m
    restart: "no"

  # One-shot: brings the API's schema up to date (holt_server/migrations)
  # with the new server image, then exits. deploy.sh runs it before swapping
  # the containers, so the old release briefly runs on the new schema: a
  # migration must keep working with the release before it (docs in
  # server/README.md). A database from before migrations is only stamped.
  migrate-server:
    image: ${HOLT_PROD_PROJECT:-holt-prod}-server:${HOLT_TAG:?set by deploy.sh}
    labels: *prod-label
    profiles: [migrate]
    environment:
      DATABASE_URL: postgresql+asyncpg://holt:${HOLT_DB_PASSWORD}@db:5432/holt
    command: ["python", "-m", "holt_server.migrate"]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 256m
    restart: "no"

  server:
    build:
      context: ${HOLT_SRC:?set by deploy.sh}
      dockerfile: deploy/server/Dockerfile
      labels: *prod-label
    image: ${HOLT_PROD_PROJECT:-holt-prod}-server:${HOLT_TAG:?set by deploy.sh}
    labels: *prod-label
    environment:
      HOLT_ENV: production
      DATABASE_URL: postgresql+asyncpg://holt:${HOLT_DB_PASSWORD}@db:5432/holt
      HOLT_INTERNAL_KEY: ${HOLT_INTERNAL_KEY:?run make-env.sh}
      HOLT_SECRET_KEY: ${HOLT_SECRET_KEY:?run make-env.sh}
      HOLT_WEB_URL: https://githolt.com
      GITHUB_TOKENS: ${GITHUB_TOKENS}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Six people's jobs at once, plus one background worker for badges
      # and warm passes (it takes a waiting person's job first). Each job is
      # a thread holding one crawl; mem_limit below is sized for seven.
      HOLT_JOB_CONCURRENCY: ${HOLT_JOB_CONCURRENCY:-6}
      HOLT_BADGE_CONCURRENCY: ${HOLT_BADGE_CONCURRENCY:-1}
      # Per-job time limits, in seconds (rules, AI, find).
      HOLT_JOB_TIMEOUT_RULES: ${HOLT_JOB_TIMEOUT_RULES:-180}
      HOLT_JOB_TIMEOUT_AI: ${HOLT_JOB_TIMEOUT_AI:-480}
      HOLT_JOB_TIMEOUT_FIND: ${HOLT_JOB_TIMEOUT_FIND:-300}
      # The warm pass (warm.sh) fills this cache for a day.
      HOLT_STARTER_CACHE_HOURS: ${HOLT_STARTER_CACHE_HOURS:-24}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db: { condition: service_healthy }
    # The image's own check, polled every second while it starts so
    # deploy/swap.sh can retire the old server as soon as this one is ready.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
      start_interval: 1s
    mem_limit: 1536m
    restart: unless-stopped

  web:
    build:
      context: ${HOLT_SRC:?set by deploy.sh}/web
      dockerfile: ../deploy/web/Dockerfile
      labels: *prod-label
      args:
        NEXT_PUBLIC_SITE_HOST: githolt.com
        NEXT_PUBLIC_FREE_AI_QUOTA: ${NEXT_PUBLIC_FREE_AI_QUOTA:-3}
        # The policy pages. Required, so a missing value fails the build
        # instead of shipping the literal CONTACT_EMAIL / CONTACT_CITY.
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:?CONTACT_EMAIL in ~/.config/holt/secrets.env (deploy.sh maps it)}
        NEXT_PUBLIC_CONTACT_CITY: ${NEXT_PUBLIC_CONTACT_CITY:?CONTACT_CITY in ~/.config/holt/secrets.env (deploy.sh maps it)}
        # Production is indexable: no ROBOTS_NOINDEX, at build or run time.
    image: ${HOLT_PROD_PROJECT:-holt-prod}-web:${HOLT_TAG:?set by deploy.sh}
    labels: *prod-label
    environment:
      HOLT_API_URL: http://server:8000
      HOLT_INTERNAL_KEY: ${HOLT_INTERNAL_KEY}
      DATABASE_URL: postgres://holt:${HOLT_DB_PASSWORD}@db:5432/holt_web
      AUTH_SECRET: ${AUTH_SECRET:?run make-env.sh}
      # Empty until ~/.config/holt/secrets.env provides them: the sign-in page
      # then shows "isn't set up here" and there is no dev sign-in
      # (NODE_ENV=production).
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      NEXT_PUBLIC_SITE_HOST: githolt.com
      AUTH_URL: https://githolt.com
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL}
      NEXT_PUBLIC_CONTACT_CITY: ${NEXT_PUBLIC_CONTACT_CITY}
      # Read the visitor IP from CF-Connecting-IP / X-Forwarded-For. Safe only
      # because web publishes no port: the one way in is tunnel -> edge
      # (127.0.0.1) -> web.
      TRUST_PROXY_HEADERS: "1"
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      server: { condition: service_healthy }
    # deploy/swap.sh starts the new web beside the old one and waits for
    # this before retiring the old one. robots.txt is rendered by Next.js
    # but never calls the API.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 1s
    mem_limit: 512m
    restart: unless-stopped

  # Front door: keeps the published port across deploys (web is recreated
  # behind it), serves /__build, redirects www to the apex, proxies the rest.
  # Its config is a directory: deploy.sh copies edge.conf into
  # $HOLT_PROD_HOME/edge/default.conf, checks it with nginx -t and reloads,
  # so config changes go live without restarting the edge. (A single-file
  # mount of ./edge.conf kept the old file after git replaced it.)
  edge:
    image: nginx:1.27-alpine
    labels: *prod-label
    ports:
      - "127.0.0.1:${HOLT_PROD_PORT:-8310}:8080"
    volumes:
      - ${HOLT_PROD_HOME:?set by deploy.sh}/edge:/etc/nginx/conf.d:ro
      - ${HOLT_PROD_HOME:?set by deploy.sh}/build:/srv/build:ro
    depends_on: [web]
    mem_limit: 32m
    restart: unless-stopped

  # Cookieless page and event counts (web/src/lib/analytics.ts). Opt-in
  # profile: deploy/prod/umami.sh creates its database and role in `db`,
  # writes UMAMI_* and COMPOSE_PROFILES=analytics to .env, starts it and
  # replaces the default admin password. From then on every deploy's
  # `compose up` keeps it running. The public only reaches /stats/script.js
  # and /stats/api/send, through the edge; the dashboard (login required) is
  # on 127.0.0.1:${HOLT_UMAMI_PORT:-8311} only, for an SSH tunnel.
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    labels: *prod-label
    profiles: [analytics]
    environment:
      # Its own role and database in the same Postgres: no second server to
      # run, and the role can't read Holt's tables.
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
      # The edge forwards Cloudflare's header untouched.
      CLIENT_IP_HEADER: cf-connecting-ip
      NODE_OPTIONS: --max-old-space-size=192
    ports:
      - "127.0.0.1:${HOLT_UMAMI_PORT:-8311}:3000"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 320m
    restart: unless-stopped

volumes:
  pgdata:
