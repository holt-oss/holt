# Holt production stack at https://githolt.com (compose project holt-prod).
#
# Run it through deploy.sh, never by hand with `compose up`: deploy.sh sets
# HOLT_SRC (a clone checked out at origin/main) and HOLT_TAG (that commit's
# SHA, the image tag), reads ~/.config/holt/secrets.env, and rolls back when
# the health check fails. Only the edge publishes a port, on 127.0.0.1, and
# the Cloudflare tunnel (see TUNNEL.md) is the one public way in.
#
#   tunnel -> edge (nginx, /__build, www redirect) -> web (Next.js) x N -> server (FastAPI) -> db
#
# web runs HOLT_WEB_REPLICAS containers (default 2); the edge spreads
# requests over them. The server stays one process.
#
# CPU priority is not set here: deploy.sh gives db, server, web and edge
# more CPU shares on the running containers (`docker update`), because
# setting it here would make compose recreate the db and the edge.
#
# Secrets come from ~/.local/share/holt-prod/.env (make-env.sh writes it;
# deploy.sh passes it with --env-file). Nothing here auto-updates.
#
# HOLT_PROD_PROJECT (default holt-prod) names the project, the images and
# the label, so a rehearsal under another name (README.md) can never touch
# the real stack's containers or images.
name: ${HOLT_PROD_PROJECT:-holt-prod}

x-prod-label: &prod-label
  holt.stack: ${HOLT_PROD_PROJECT:-holt-prod}

services:
  db:
    image: postgres:16-alpine
    labels: *prod-label
    environment:
      POSTGRES_USER: holt
      POSTGRES_PASSWORD: ${HOLT_DB_PASSWORD:?run make-env.sh}
      POSTGRES_DB: holt
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    # max_connections, the budget (the most each client can hold open):
    #   server            15  HOLT_DB_POOL_SIZE 10, its health check's own 1,
    #                         /metrics' own 1 once it is scraped, and 1 per
    #                         background pass under a lock (the contributions
    #                         refresh; PR watch and its mailer when on)
    #   a second server   15  while a deploy swaps the server (deploy/swap.sh)
    #   warm pass         13  warm.sh's one-off server container: pool 10, its
    #                         lock, and a second timer starting while it runs
    #   web               15  5 each (web/src/db/index.ts), HOLT_WEB_REPLICAS
    #                         at its most, 3
    #   a second web set  15  while a deploy swaps web
    #   umami             10
    #   one-offs           4  migrate-web, migrate-server, backup.sh, psql
    #   monitoring         3  holt_monitor's limit (deploy/monitoring); it uses 1
    # A deploy swaps the server first and web after it, never both at once, so
    # the most open together is 75 of 80 (in either swap, with three web
    # containers). A fourth would need 85 during the web swap: deploy.sh
    # refuses HOLT_WEB_REPLICAS over 3 until this is raised.
    # A connection costs about 2 MB here once it has run the usual queries
    # (measured), so all 75 at once is ~150 MB next to shared_buffers, inside
    # mem_limit; on a normal day about 35 are open. Raise HOLT_DB_POOL_SIZE
    # and this together, and mem_limit with them.
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=80"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holt -d holt"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    restart: unless-stopped

  # One-shot: applies web/drizzle/*.sql (Auth.js tables) to holt_web, each
  # file once, then exits. deploy.sh runs it before swapping the containers.
  migrate-web:
    image: postgres:16-alpine
    labels: *prod-label
    profiles: [migrate]
    environment:
      PGHOST: db
      PGUSER: holt
      PGPASSWORD: ${HOLT_DB_PASSWORD}
      PGDATABASE: holt_web
    volumes:
      - ${HOLT_SRC:?set by deploy.sh}/web/drizzle:/migrations:ro
      - ./migrate-web.sh:/migrate-web.sh:ro
    entrypoint: ["sh", "/migrate-web.sh"]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 64m
    restart: "no"

  # One-shot: brings the API's schema up to date (holt_server/migrations)
  # with the new server image, then exits. deploy.sh runs it before swapping
  # the containers, so the old release briefly runs on the new schema: a
  # migration must keep working with the release before it (docs in
  # server/README.md). A database from before migrations is only stamped.
  migrate-server:
    image: ${HOLT_PROD_PROJECT:-holt-prod}-server:${HOLT_TAG:?set by deploy.sh}
    labels: *prod-label
    profiles: [migrate]
    environment:
      DATABASE_URL: postgresql+asyncpg://holt:${HOLT_DB_PASSWORD}@db:5432/holt
    command: ["python", "-m", "holt_server.migrate"]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 256m
    restart: "no"

  server:
    build:
      context: ${HOLT_SRC:?set by deploy.sh}
      dockerfile: deploy/server/Dockerfile
      labels: *prod-label
    image: ${HOLT_PROD_PROJECT:-holt-prod}-server:${HOLT_TAG:?set by deploy.sh}
    labels: *prod-label
    environment:
      HOLT_ENV: production
      DATABASE_URL: postgresql+asyncpg://holt:${HOLT_DB_PASSWORD}@db:5432/holt
      HOLT_INTERNAL_KEY: ${HOLT_INTERNAL_KEY:?run make-env.sh}
      HOLT_SECRET_KEY: ${HOLT_SECRET_KEY:?run make-env.sh}
      HOLT_WEB_URL: https://githolt.com
      GITHUB_TOKENS: ${GITHUB_TOKENS}
      # The GitHub App (the maintainers' ops notes): set up, the server reads
      # GitHub as the app and GITHUB_TOKENS is not used. The key is mounted
      # read-only below; the server's user reads it through its group.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY_FILE: ${GITHUB_APP_PRIVATE_KEY_FILE:+/run/secrets/github_app_key}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # The model provider, base URL and model, from secrets.env; unset keeps
      # the server's defaults.
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-5-mini}
      HOLT_MODEL_PROVIDER: ${HOLT_MODEL_PROVIDER:-}
      HOLT_MODEL_REASONING_EFFORT: ${HOLT_MODEL_REASONING_EFFORT:-}
      # AI is OFF in production: a budget of 0. Only prod-named variables in
      # $HOLT_PROD_HOME/.env or secrets.env can change that (a
      # HOLT_AI_BUDGET_USD meant for staging never reaches here), and the
      # server ignores a budget without the owner's explicit OWNER_OK=1.
      HOLT_AI_BUDGET_USD: ${HOLT_PROD_AI_BUDGET_USD:-0}
      HOLT_AI_BUDGET_OWNER_OK: ${HOLT_PROD_AI_BUDGET_OWNER_OK:-0}
      # PR watch (server/README.md, "PR watch"): off until the owner sets
      # HOLT_PROD_PR_WATCH=1 in $HOLT_PROD_HOME/.env or secrets.env (a
      # HOLT_PR_WATCH meant for staging never reaches here). Alert emails
      # need RESEND_API_KEY in secrets.env; without it none are sent.
      HOLT_PR_WATCH: ${HOLT_PROD_PR_WATCH:-0}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Account emails (server/README.md, "Account emails"): off until the
      # owner sets HOLT_PROD_ACCOUNT_EMAILS=1 the same way (staging's
      # HOLT_ACCOUNT_EMAILS never reaches here).
      HOLT_ACCOUNT_EMAILS: ${HOLT_PROD_ACCOUNT_EMAILS:-0}
      # Six people's jobs at once, plus three background workers for badges
      # and warm passes (each takes a waiting person's job first); a warm
      # pass keeps HOLT_WARM_PARALLEL reports in flight. Each job is a thread
      # holding one crawl, ~50 MB at most (the largest golden recording
      # peaks at 44 MB); mem_limit below is sized for nine.
      HOLT_JOB_CONCURRENCY: ${HOLT_JOB_CONCURRENCY:-6}
      HOLT_BADGE_CONCURRENCY: ${HOLT_BADGE_CONCURRENCY:-3}
      HOLT_WARM_PARALLEL: ${HOLT_WARM_PARALLEL:-3}
      # The refresh tiers' ages: how old a report gets before `warm --tier`
      # reads it again. warm.sh and warm-refresh.sh both get them from here.
      HOLT_REFRESH_WEEKLY_HOURS: ${HOLT_REFRESH_WEEKLY_HOURS:-168}
      HOLT_REFRESH_MONTHLY_HOURS: ${HOLT_REFRESH_MONTHLY_HOURS:-720}
      # Database connections this server keeps (holt_server/db.py): one for
      # each of the nine job workers' short writes and their heartbeat, which
      # page requests share, each for a few milliseconds. No overflow: opening
      # a connection under load is what slows it. A request waits this many
      # seconds for one, then fails. Counted in db's max_connections above.
      HOLT_DB_POOL_SIZE: ${HOLT_DB_POOL_SIZE:-10}
      HOLT_DB_MAX_OVERFLOW: ${HOLT_DB_MAX_OVERFLOW:-0}
      HOLT_DB_POOL_TIMEOUT: ${HOLT_DB_POOL_TIMEOUT:-10}
      # Per-job time limits, in seconds (rules, AI, find).
      HOLT_JOB_TIMEOUT_RULES: ${HOLT_JOB_TIMEOUT_RULES:-180}
      HOLT_JOB_TIMEOUT_AI: ${HOLT_JOB_TIMEOUT_AI:-480}
      HOLT_JOB_TIMEOUT_FIND: ${HOLT_JOB_TIMEOUT_FIND:-300}
      # The warm pass (warm.sh) fills this cache for a day.
      HOLT_STARTER_CACHE_HOURS: ${HOLT_STARTER_CACHE_HOURS:-24}
      # Every report's evidence, kept (holt_server/evidence_store.py), in
      # $HOLT_PROD_HOME/evidence on /home, not the root disk. env.sh makes the
      # directory; the server writes through its group (group_add). Keep days
      # 0 = keep all. `warm.sh --stale-only` reuses snapshots this young.
      HOLT_EVIDENCE_DIR: /data/evidence
      HOLT_EVIDENCE_KEEP_DAYS: ${HOLT_EVIDENCE_KEEP_DAYS:-0}
      HOLT_EVIDENCE_REUSE_HOURS: ${HOLT_EVIDENCE_REUSE_HOURS:-168}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${HOLT_PROD_HOME:?set by deploy.sh}/evidence:/data/evidence
    secrets: [github_app_key]
    group_add: ["${HOLT_GITHUB_APP_KEY_GID:-10001}", "${HOLT_EVIDENCE_GID:-65534}"]
    depends_on:
      db: { condition: service_healthy }
    # GET /metrics (holt_server/metrics.py) is on the same port, 8000, which
    # is not published: only this network reaches it. The optional monitoring
    # stack (deploy/monitoring) joins this network and scrapes every container
    # that answers to `server`.
    # The image's own check, polled every second while it starts so
    # deploy/swap.sh can retire the old server as soon as this one is ready.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 90s
      start_interval: 1s
    mem_limit: 1536m
    restart: unless-stopped

  web:
    build:
      context: ${HOLT_SRC:?set by deploy.sh}/web
      dockerfile: ../deploy/web/Dockerfile
      labels: *prod-label
      args:
        NEXT_PUBLIC_SITE_HOST: githolt.com
        NEXT_PUBLIC_FREE_AI_QUOTA: ${NEXT_PUBLIC_FREE_AI_QUOTA:-3}
        # The policy pages. Required, so a missing value fails the build
        # instead of shipping the literal CONTACT_EMAIL / CONTACT_CITY.
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:?CONTACT_EMAIL in ~/.config/holt/secrets.env (deploy.sh maps it)}
        NEXT_PUBLIC_CONTACT_CITY: ${NEXT_PUBLIC_CONTACT_CITY:?CONTACT_CITY in ~/.config/holt/secrets.env (deploy.sh maps it)}
        # Production is indexable: no ROBOTS_NOINDEX, at build or run time.
    image: ${HOLT_PROD_PROJECT:-holt-prod}-web:${HOLT_TAG:?set by deploy.sh}
    labels: *prod-label
    environment:
      HOLT_API_URL: http://server:8000
      HOLT_INTERNAL_KEY: ${HOLT_INTERNAL_KEY}
      DATABASE_URL: postgres://holt:${HOLT_DB_PASSWORD}@db:5432/holt_web
      AUTH_SECRET: ${AUTH_SECRET:?run make-env.sh}
      # Empty until ~/.config/holt/secrets.env provides them: the sign-in page
      # then shows "isn't set up here" and there is no dev sign-in
      # (NODE_ENV=production).
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      NEXT_PUBLIC_SITE_HOST: githolt.com
      AUTH_URL: https://githolt.com
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL}
      NEXT_PUBLIC_CONTACT_CITY: ${NEXT_PUBLIC_CONTACT_CITY}
      # Read the visitor IP from CF-Connecting-IP / X-Forwarded-For. Safe only
      # because web publishes no port: the one way in is tunnel -> edge
      # (127.0.0.1) -> web.
      TRUST_PROXY_HEADERS: "1"
      # Two thirds of mem_limit for the heap; the rest is buffers, compiled
      # code and response streams (about 120 MB under load).
      NODE_OPTIONS: --max-old-space-size=512
    depends_on:
      server: { condition: service_healthy }
    # One Next.js process renders on one core, about 23 pages a second, so
    # the site runs several: HOLT_WEB_REPLICAS in $HOLT_PROD_HOME/.env, 1 to
    # 3 (the db's max_connections above is sized for 3). All of them answer
    # to `web`, and the edge picks one per request. Each keeps its own small
    # caches and per-IP counters (web/src/lib/rate-limit.ts, find-cache.ts).
    deploy:
      replicas: ${HOLT_WEB_REPLICAS:-2}
    # deploy/swap.sh starts the new web containers beside the old ones and
    # waits for this on every one before retiring the old ones. robots.txt
    # is rendered by Next.js but never calls the API.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 1s
    # Per container. One process reached 503 MB under 200 concurrent readers.
    mem_limit: 768m
    restart: unless-stopped

  # Front door: keeps the published port across deploys (web is recreated
  # behind it), serves /__build, redirects www to the apex, and spreads the
  # rest over the web containers.
  # Its config is a directory: deploy.sh copies edge.conf into
  # $HOLT_PROD_HOME/edge/default.conf, checks it with nginx -t and reloads,
  # so config changes go live without restarting the edge. (A single-file
  # mount of ./edge.conf kept the old file after git replaced it.)
  edge:
    image: nginx:1.27-alpine
    labels: *prod-label
    ports:
      - "127.0.0.1:${HOLT_PROD_PORT:-8310}:8080"
    volumes:
      - ${HOLT_PROD_HOME:?set by deploy.sh}/edge:/etc/nginx/conf.d:ro
      - ${HOLT_PROD_HOME:?set by deploy.sh}/build:/srv/build:ro
    depends_on: [web]
    mem_limit: 32m
    restart: unless-stopped

  # Cookieless page and event counts (web/src/lib/analytics.ts). Opt-in
  # profile: deploy/prod/umami.sh creates its database and role in `db`,
  # writes UMAMI_* and COMPOSE_PROFILES=analytics to .env, starts it and
  # replaces the default admin password. From then on every deploy's
  # `compose up` keeps it running. The public only reaches /stats/script.js
  # and /stats/api/send, through the edge; the dashboard (login required) is
  # on 127.0.0.1:${HOLT_UMAMI_PORT:-8311} only, for an SSH tunnel.
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    labels: *prod-label
    profiles: [analytics]
    environment:
      # Its own role and database in the same Postgres: no second server to
      # run, and the role can't read Holt's tables.
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
      # The edge forwards Cloudflare's header untouched.
      CLIENT_IP_HEADER: cf-connecting-ip
      NODE_OPTIONS: --max-old-space-size=192
    ports:
      - "127.0.0.1:${HOLT_UMAMI_PORT:-8311}:3000"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 320m
    restart: unless-stopped

volumes:
  pgdata:

secrets:
  # The GitHub App's private key on the host (GITHUB_APP_PRIVATE_KEY_FILE in
  # the secrets file), at /run/secrets/github_app_key; /dev/null without one.
  github_app_key:
    file: ${GITHUB_APP_PRIVATE_KEY_FILE:-/dev/null}
