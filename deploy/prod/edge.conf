# nginx in front of the production web app. Cloudflare's tunnel connects to
# it on 127.0.0.1 and already sets CF-Connecting-IP, X-Forwarded-For and
# X-Forwarded-Proto; they are forwarded untouched.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Behind the tunnel every request is https; when hit directly (local checks,
# smoke tests) keep the scheme the request came in with.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }

server {
    listen 8080;
    server_tokens off;

    # www.githolt.com -> githolt.com (also possible as a Cloudflare redirect
    # rule; doing it here means it works even without one).
    if ($host = www.githolt.com) {
        return 301 https://githolt.com$request_uri;
    }

    location = /__build {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        alias /srv/build/build.json;
    }
    location = /__build.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        alias /srv/build/build.json;
    }

    location / {
        # Re-resolve web after it is recreated by a deploy.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $web http://web:3000;
        proxy_pass $web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Server-Sent Events: no buffering, long reads.
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 2m;
    }
}
