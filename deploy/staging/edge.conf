# nginx in front of the web app. Cloudflare's tunnel connects to it on
# 127.0.0.1 and already sets CF-Connecting-IP, X-Forwarded-For and
# X-Forwarded-Proto; they are forwarded untouched.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 8080;
    server_tokens off;

    location = /__build {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        alias /srv/build/build.json;
    }
    location = /__build.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        alias /srv/build/build.json;
    }

    location / {
        # Re-resolve web after it is recreated.
        resolver 127.0.0.11 valid=2s ipv6=off;
        set $web http://web:3000;
        proxy_pass $web;
        # Two web containers answer to `web` while a deploy swaps them: if
        # one refuses or is gone, try the other. Connecting on this host
        # takes a millisecond; an address from the DNS cache (valid=2s) whose
        # container just stopped never answers, so give up on it after 1s.
        proxy_connect_timeout 1s;
        error_page 502 503 504 = @updating;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Server-Sent Events: no buffering, long reads.
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 2m;
    }

    # Shown when web can't be reached: nginx's own 502 (refused), 503 or 504
    # (timeout), never the app's own error pages. A deploy swaps web with no
    # gap (deploy/swap.sh), so this is the fallback for when something still
    # goes wrong. An origin 503 with a body is passed through by Cloudflare
    # as it is, so visitors see this instead of Cloudflare's error page.
    # Never cached (Cloudflare or browser), Retry-After for crawlers, and it
    # reloads itself once the site answers again. No single quotes or dollar
    # signs in the page: it is an nginx string.
    location @updating {
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "no-store" always;
        add_header Retry-After 10 always;
        return 503 '<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Holt is updating</title>
<noscript><meta http-equiv="refresh" content="5"></noscript>
<style>
:root{--bg:#f5f2ec;--ink:#111723;--muted:#586071;--blue:#1f48cf;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d0e0e;--ink:#e7e5dc;--muted:#a3a39b;--blue:#83a9ff;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:16px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
main{max-width:30rem;text-align:center}
.cat{font-size:clamp(2.25rem,11vw,3.25rem);color:var(--blue);white-space:nowrap;margin:0 0 1.25rem}
h1{font-size:1.25rem;margin:0 0 .5rem}
p{margin:0;color:var(--muted)}
.dot{display:inline-block;color:var(--blue);animation:b 1.4s ease-in-out infinite}
@keyframes b{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<main>
<div class="cat" aria-hidden="true">(=^•ω•^=)</div>
<h1>Holt is updating.</h1>
<p>Back in a few seconds. <span class="dot">●</span></p>
<p>This page reloads by itself.</p>
</main>
<script>
setInterval(function(){fetch(location.href,{method:"HEAD",cache:"no-store"}).then(function(r){if(r.status<500)location.reload()},function(){})},5000)
</script>
</body>
</html>
';
    }
}
