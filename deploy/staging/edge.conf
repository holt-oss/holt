# nginx in front of the web app. The staging nginx already sets
# X-Forwarded-* and passes CF-Connecting-IP; forward them untouched.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 8080;
    server_tokens off;

    location = /__build {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        alias /srv/build/build.json;
    }
    location = /__build.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        alias /srv/build/build.json;
    }

    location / {
        # Re-resolve web after it is recreated.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web http://web:3000;
        proxy_pass $web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Server-Sent Events: no buffering, long reads.
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 2m;
    }
}
