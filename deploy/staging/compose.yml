# Holt staging stack at https://holt-new.aahil-khan.xyz
#
# Run it through preview.sh (or see ../README.md). Compose project:
# stage-holt-new. Only the edge publishes a port, on 127.0.0.1, and the
# staging nginx proxies holt-new.aahil-khan.xyz to it
# (`~/staging/bin/stagectl proxy holt-new <port>`).
#
#   edge (nginx, /__build) -> web (Next.js) -> server (FastAPI) -> db
#
# Secrets come from .env next to this file (gitignored; make-env.sh writes it).
name: stage-holt-new

x-stage-label: &stage-label
  holt.stage: holt-new

services:
  db:
    image: postgres:16-alpine
    labels: *stage-label
    environment:
      POSTGRES_USER: holt
      POSTGRES_PASSWORD: ${HOLT_DB_PASSWORD:?run make-env.sh}
      POSTGRES_DB: holt
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=40"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holt -d holt"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    restart: unless-stopped

  # Applies web/drizzle/*.sql (Auth.js tables) to the holt_web database once
  # each, then exits. Uses the db image, so nothing extra is pulled.
  migrate-web:
    image: postgres:16-alpine
    labels: *stage-label
    environment:
      PGHOST: db
      PGUSER: holt
      PGPASSWORD: ${HOLT_DB_PASSWORD}
      PGDATABASE: holt_web
    volumes:
      - ../../web/drizzle:/migrations:ro
      - ./migrate-web.sh:/migrate-web.sh:ro
    entrypoint: ["sh", "/migrate-web.sh"]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 64m
    restart: "no"

  server:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
      labels: *stage-label
    image: stage-holt-new-server:latest
    labels: *stage-label
    environment:
      HOLT_ENV: ${HOLT_ENV:-staging}
      DATABASE_URL: postgresql+asyncpg://holt:${HOLT_DB_PASSWORD}@db:5432/holt
      HOLT_INTERNAL_KEY: ${HOLT_INTERNAL_KEY:?run make-env.sh}
      HOLT_SECRET_KEY: ${HOLT_SECRET_KEY:?run make-env.sh}
      HOLT_WEB_URL: ${HOLT_WEB_URL}
      GITHUB_TOKENS: ${GITHUB_TOKENS}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HOLT_JOB_CONCURRENCY: ${HOLT_JOB_CONCURRENCY:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 512m
    restart: unless-stopped

  web:
    build:
      context: ../../web
      dockerfile: ../deploy/web/Dockerfile
      labels: *stage-label
      args:
        NEXT_PUBLIC_SITE_HOST: ${NEXT_PUBLIC_SITE_HOST}
        NEXT_PUBLIC_FREE_AI_QUOTA: ${NEXT_PUBLIC_FREE_AI_QUOTA:-3}
        # Staging must never be indexed; build time too, for prerendered pages.
        ROBOTS_NOINDEX: "1"
    image: stage-holt-new-web:latest
    labels: *stage-label
    environment:
      HOLT_API_URL: http://server:8000
      HOLT_INTERNAL_KEY: ${HOLT_INTERNAL_KEY}
      DATABASE_URL: postgres://holt:${HOLT_DB_PASSWORD}@db:5432/holt_web
      AUTH_SECRET: ${AUTH_SECRET:?run make-env.sh}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      NEXT_PUBLIC_SITE_HOST: ${NEXT_PUBLIC_SITE_HOST}
      AUTH_URL: ${HOLT_WEB_URL}
      # Read the visitor IP from CF-Connecting-IP / X-Forwarded-For. Safe only
      # because web publishes no port: the one way in is tunnel -> staging
      # nginx -> edge (127.0.0.1) -> web.
      TRUST_PROXY_HEADERS: "1"
      ROBOTS_NOINDEX: "1"
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      server: { condition: service_healthy }
      migrate-web: { condition: service_completed_successfully }
    mem_limit: 512m
    restart: unless-stopped

  # Front door: serves /__build (what's live) and proxies the rest to web.
  edge:
    image: nginx:1.27-alpine
    labels: *stage-label
    ports:
      - "127.0.0.1:${HOLT_STAGE_PORT:-9110}:8080"
    volumes:
      - ./edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./build:/srv/build:ro
    depends_on: [web]
    mem_limit: 32m
    restart: unless-stopped

volumes:
  pgdata:
