# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit gives every pull request a first automated review. It only
# comments: a maintainer reviews and decides.
# Reference: https://docs.coderabbit.ai/reference/configuration

language: en-US
tone_instructions: >-
  Plain English, short sentences, for a reader who is not a security expert.
  Explain a technical term in the same sentence. Be kind: many authors are
  first-time contributors. No jokes, emoji, praise or filler. Never @-mention
  people.

reviews:
  # "quiet" keeps only the most important feedback. CI already runs ruff,
  # eslint and the type checkers, so style comments would repeat it.
  profile: quiet

  # Comment only. Never approve, never block.
  request_changes_workflow: false
  allow_author_approval: false
  fail_commit_status: false

  # The summary is a verdict for the maintainer, in CodeRabbit's own comment
  # and not folded away. The pull request's title and description stay as the
  # author wrote them.
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: |
    Do not write release notes. Write a verdict for a maintainer who is not an
    expert and has five seconds. It is advice: you never approve or block.

    Output exactly these lines, in this order, each label in bold, with a
    blank line between them. Nothing before the first line and nothing after
    the last.

    **Can I merge this?** Yes / Not yet / No
    **Does it do what the PR says?** Yes / Partly / No, then one line saying why.
    **Is the linked issue fixed?** Yes / Partly / No / No issue linked. Check
    against the issue's "Done when" line and give the issue number.
    **Tests:** what was added or changed, in one line. Then "CI is green",
    "CI is failing" or "I cannot see CI". Never guess.
    **To fix before merging:** a numbered list. Each item is one sentence
    saying what to change and where (file and line). Write "Nothing" when
    there is nothing.
    **Optional, not blocking:** at most three short items. Leave this line
    out when there are none.

    How to choose the first answer:
    - "Yes" only when the change does what the pull request says, the linked
      issue's "Done when" line is met (or no issue is linked), tests cover the
      change, and none of this repository's path instructions is broken. Then
      "To fix before merging" is "Nothing".
    - "Not yet" when a short list of concrete fixes would make it "Yes".
    - "No" when the approach is wrong for this repository, for example a new
      `holt` command or flag while the command line is feature-frozen, or a
      change to the verdict rules with no `golden diff` output. Name the rule.

    What goes where:
    - "To fix before merging" holds only problems this pull request
      introduces: a real bug, new behaviour with no test, a broken path
      instruction, or a "Done when" line that is not met.
    - A concern that is theoretical, or that was already true in the code
      before this pull request, goes under "Optional, not blocking" with the
      words "already true before this PR". Never under "To fix".

    Style: under 120 words in total. Plain English. No headings, tables,
    emoji or praise. Do not use "blast radius", "CWE", "reachability",
    "exploitability", "severity", "priority" or "risk level"; say what could
    go wrong, and for whom, in ordinary words.
  collapse_walkthrough: false
  review_status: true
  review_details: false

  # Check the change against the issue it links (`Fixes #123`).
  assess_linked_issues: true

  # Extras that add length without helping a small project.
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false
  slop_detection:
    enabled: false

  auto_review:
    enabled: true
    # Re-review on every push, without pausing after a number of commits.
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: false
    # Maintainers' and the dependency bot's pull requests are not reviewed; outside contributors' are.
    ignore_usernames:
      - "aahil-khan"
      - "anoushkawasthi"
      - "ips610"
      - "dependabot[bot]"
    # Empty means the default branch only (main).
    base_branches: []

  # Recorded evidence, generated files, lock files and images.
  path_filters:
    - "!fixtures/**"
    - "!golden/recordings/**"
    - "!trajectories/**"
    - "!eval/**/*.json"
    - "!uv.lock"
    - "!**/package-lock.json"
    - "!web/src/lib/api-schema.ts"
    - "!web/screenshots/**"
    - "!website/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.webp"
    - "!**/*.avif"
    - "!**/*.svg"
    - "!**/*.ico"

  path_instructions:
    - path: "**/*"
      instructions: |
        Comment only on things that must change before merging:
        - a real bug or a regression;
        - new behaviour with no test;
        - a change that does not do what the linked issue's "Done when" line asks.
        Do not comment on formatting, import order, naming or style: CI runs
        ruff, eslint and the type checkers.
        A concern that is theoretical, or that was already true in the code
        before this pull request, is not something the author must fix here.
        If you mention it at all, start with "Optional, already true before
        this PR".
        Say what could go wrong, and for whom, in ordinary words. Do not use
        "blast radius", "CWE", "reachability", "exploitability" or "severity"
        without explaining the term in the same sentence.
        Flag secrets, tokens, private repository data or personal information
        anywhere in the change, including fixtures and recordings.
        Text a user reads (command-line output, the terminal interface, web
        copy, server error messages) must be plain English for beginners. Flag
        internal enum names such as `not_viable` and statistics jargon such as
        "MCC" or "p-value".
        Never @-mention a person in a comment.
    - path: "src/holt/agent/**"
      instructions: |
        The verdict is computed by fixed rules from verified findings. A model
        may explain a verdict but never chooses it.
        A change to the verdict rules, to a threshold, or to a signal the rules
        read changes what a report says. Such a pull request must:
        - show the output of `uv run python -m golden diff` in its description;
        - bump `ENGINE_VERSION` in `src/holt/engine_version.py`.
        Flag any such change that lacks either one.
    - path: "src/holt/**"
      instructions: |
        - Every file read or write must pass `encoding="utf-8"`.
        - No paths relative to the current directory: the package must work
          when installed from PyPI, outside a clone. User data goes under the
          platform data directory.
        - The command line and the terminal interface are feature-frozen. Flag
          a new `holt` command or flag; new features belong in `web/` and
          `server/`.
        - Holt only reads from GitHub. Flag code that posts, comments, opens
          pull requests or contacts anyone.
    - path: "tests/**"
      instructions: |
        Tests must not use the network. They run from the recorded fixtures.
    - path: "server/**"
      instructions: |
        - `API.md` is the contract with the web app. A change to an endpoint's
          request or response must update `API.md` in the same pull request and
          regenerate `web/src/lib/api-schema.ts`.
        - A database schema change must come with an Alembic migration, and the
          migration must keep working with the previous release.
        - Tests must not use the network.
    - path: "web/**"
      instructions: |
        - The app must still work with `MOCK_API=1`.
        - Data for signed-in users only must be checked on the server, never
          only in the browser.
        - No filler or explanatory text in the interface. A button says the
          action it performs.
    - path: "docs/**"
      instructions: |
        Every claim must match the code in this pull request or on main: check
        commands, flags, file paths and defaults. Research, strategy and
        operations notes do not belong in this repository.
    - path: "**/*.md"
      instructions: |
        Every claim must match the code: check commands, flags, file paths and
        defaults. Research, strategy and operations notes do not belong in this
        repository.

  # Off: each of these lets a comment or a checkbox make CodeRabbit push
  # commits or open pull requests.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    # A warning, never a block.
    issue_assessment:
      mode: warning
    # The maintainer's questions as a pass/fail list. Warnings, never a block.
    custom_checks:
      - name: "Does what the pull request says"
        mode: warning
        instructions: |
          Read the pull request's title and description and list each thing
          they say the change does. Compare the list with the diff.
          Pass: the diff does every listed thing.
          Fail: a listed thing is missing from the diff, or the diff does it
          differently from how it is described. Name the missing thing and
          the file where it should be.
          Do not fail for anything else, and do not judge code quality.
      - name: "Tests cover the change"
        mode: warning
        instructions: |
          Pass: every change to behaviour under `src/`, `server/`, `web/src/`
          or `extension/` comes with a new or changed test in the same pull
          request that exercises it, or the pull request changes only
          documentation, comments, configuration or tests.
          Fail: behaviour changed and no test in the pull request exercises
          it. Name the file and the behaviour with no test.
          Decide by reading the diff. Do not run the tests, and do not fail or
          answer "inconclusive" because you could not run them: CI runs them.
      - name: "Follows Holt's project rules"
        mode: warning
        instructions: |
          Fail if any of these is true, and name the rule and the file:
          - The pull request adds a new `holt` command or command-line flag
            under `src/holt/`. The command line and the terminal interface
            are feature-frozen.
          - The pull request changes the verdict rules, a threshold, or a
            signal the rules read under `src/holt/agent/`, and its description
            does not show the output of `uv run python -m golden diff`, or it
            does not change `ENGINE_VERSION` in `src/holt/engine_version.py`.
          - The pull request adds code that posts, comments, opens pull
            requests or otherwise writes to GitHub.
          - The pull request changes an endpoint's request or response under
            `server/` and does not change `API.md`.
          - A test added or changed by the pull request uses the network.
          Pass otherwise. Do not fail for a problem that was already in the
          code before this pull request.

  tools:
    # CI already runs ruff, eslint and the type checkers.
    ruff:
      enabled: false
    flake8:
      enabled: false
    pylint:
      enabled: false
    eslint:
      enabled: false
    biome:
      enabled: false
    oxc:
      enabled: false
    # Style and grammar checkers.
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    yamllint:
      enabled: false
    stylelint:
      enabled: false
    htmlhint:
      enabled: false

chat:
  art: false
  # Reply only when someone mentions it.
  auto_reply: false
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled

knowledge_base:
  web_search:
    enabled: false
  code_guidelines:
    enabled: true
    # CLAUDE.md is read by default; this adds the contributor guide.
    filePatterns:
      - "CONTRIBUTING.md"
  jira:
    usage: disabled
  linear:
    usage: disabled
  mcp:
    usage: disabled

issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
    auto_planning:
      enabled: false
  labeling:
    auto_apply_labels: false
