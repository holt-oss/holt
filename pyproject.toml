[project]
name = "holt-cli"
version = "0.2.0"
description = "Evidence-backed assessment of whether a GitHub repository is a viable opportunity for an external contributor."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Aahil Khan", email = "aahilminookhan@gmail.com" },
]
maintainers = [
    { name = "Aahil Khan", email = "aahilminookhan@gmail.com" },
]
keywords = [
    "open-source",
    "github",
    "contributors",
    "repository-analysis",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]
dependencies = [
    "anthropic>=0.60",
    "httpx>=0.27",
    "openai>=3.6.0",
    "textual>=0.80",
]

[project.scripts]
holt = "holt.cli:main"

[project.urls]
Homepage = "https://githolt.com"
Documentation = "https://github.com/holt-oss/holt/tree/main/docs"
Repository = "https://github.com/holt-oss/holt.git"
Issues = "https://github.com/holt-oss/holt/issues"
Changelog = "https://github.com/holt-oss/holt/blob/main/CHANGELOG.md"
Security = "https://github.com/holt-oss/holt/security/policy"

[dependency-groups]
# holt-server is the web API in server/. It rides in the dev group so one
# `uv sync` gives a working tree for both, and its tests run with the rest.
# Dependency groups are never published, so the PyPI package is unaffected.
# pytest-xdist runs the suite across cores: `uv run pytest -n auto` (CI does).
dev = ["pytest>=8.0", "pytest-xdist>=3.8", "holt-server"]

[tool.uv.workspace]
members = ["server"]

[tool.uv.sources]
holt-server = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/holt"]

# The Git repository carries large reproducibility fixtures. They belong in a
# clone, not in the package uploaded to an index. An explicit source allowlist
# also prevents ignored or untracked workspace files from entering a release.
[tool.hatch.build.targets.sdist]
only-include = ["src/holt"]

[tool.pytest.ini_options]
testpaths = ["tests", "eval", "server/tests"]
# eval/ lives at the repo root, outside the installed src/holt package.
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
extend-exclude = ["fixtures", "trajectories", "web", "extension", "e2e", "website"]

[tool.ruff.lint]
# Ruff's classic core set: syntax errors, undefined or unused names, and a few
# statement-level mistakes. Widen it one rule family at a time, fixing as you go.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# eval/ and scripts/ are frozen research material from the competition.
"eval/**" = ["E7", "F541", "F401", "F841"]
"scripts/**" = ["E741"]
# Baseline: findings present when ruff was introduced. Each is a follow-up;
# remove the entry once the file is clean.
"src/holt/discover.py" = ["F841"]
"src/holt/tui/screens/assessment.py" = ["F541"]
"src/holt/tui/screens/models.py" = ["F401"]
"tests/test_discover.py" = ["F401"]
"tests/test_evidence_bounds.py" = ["F401", "F811"]
"tests/test_models.py" = ["F401"]
"tests/test_tui_discovery.py" = ["F401"]
"tests/test_tui_observe.py" = ["F401", "E402"]
