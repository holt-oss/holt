# The failure this repository already had once: a passing-count sat in
# REPRODUCTION.md while one of those tests was failing. `test_docs_claims.py`
# checks the number the guide promises against the number the suite *collects*,
# because a test that runs the whole suite inside itself does not terminate --
# so nothing was checking that the suite still passed. This is that check.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build distributions
        run: uv build

      - name: Check distribution contents
        run: uv run --no-project python scripts/check_dist.py dist

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The extra is installed deliberately: it is the setup REPRODUCTION.md
      # promises `no skips` for. The plain-sync path is the job below, which
      # is the one a reader runs first.
      - name: Install
        run: uv sync --extra tui

      - name: Tests
        run: uv run pytest -rs

  # A reader who runs `uv sync` and nothing else must still get a working tool.
  # This job never installs the TUI extra, so an import of Textual that escapes
  # into a non-TUI path fails here rather than on their machine.
  without-the-optional-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Tests
        run: uv run pytest -rs

      # The two commands the README puts in front of the reader, run the way the
      # reader runs them. Both must work from committed evidence with no key.
      - name: The README's headline commands
        run: |
          PYTHONPATH=. uv run holt analyze NixOS/nixpkgs --replay
          PYTHONPATH=. uv run python eval/harness.py --replay --run-tag run1
