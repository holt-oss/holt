# The failure this repository already had once: a passing-count sat in
# docs/research/REPRODUCTION.md while one of those tests was failing. `test_docs_claims.py`
# checks the number the guide promises against the number the suite *collects*,
# because a test that runs the whole suite inside itself does not terminate --
# so nothing was checking that the suite still passed. This is that check.
name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # On a pull request the Python jobs run unless every changed file is in the
  # web app, the extension, the e2e tests, the legacy site or the docs. The
  # exceptions are files a Python test reads (the docs whose numbers
  # test_docs_claims checks, the example report test_example_report compares,
  # the e2e files test_staging_preview scans). On main everything always runs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.code.outputs.python == 'true' || steps.read.outputs.read == 'true' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: code
        with:
          # A file counts only if it matches every pattern: anything outside those folders.
          predicate-quantifier: every
          filters: |
            python:
              - '**'
              - '!web/**'
              - '!extension/**'
              - '!e2e/**'
              - '!website/**'
              - '!docs/**'
      - uses: dorny/paths-filter@v4.0.3
        id: read
        with:
          filters: |
            read:
              - 'docs/research/**'
              - 'docs/USAGE.md'
              - 'web/src/lib/example-ai-report.json'
              - 'e2e/playwright.config.ts'
              - 'e2e/lighthouse.mjs'

  package:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build distributions
        run: uv build

      - name: Check distribution contents
        run: uv run --no-project python scripts/check_dist.py dist

      - name: Install and smoke-test the wheel
        run: |
          uv venv .release-venv
          uv pip install --python .release-venv/bin/python dist/*.whl
          .release-venv/bin/python -c "import holt.tui.app"
          .release-venv/bin/holt --help

  tests:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --locked

      # One worker per core (pytest-xdist).
      - name: Tests
        run: uv run pytest -rs -n auto --durations=15

      # The no-key paths remain part of the product contract even though PyPI
      # installs are aimed at live use.
      - name: No-key smoke tests
        run: |
          PYTHONPATH=. uv run holt analyze NixOS/nixpkgs --replay
          PYTHONPATH=. uv run python eval/harness.py --replay --run-tag run1

      # Offline. Fails on any verdict or count on the golden set that changed
      # without `python -m golden approve --reason` (golden/README.md). The
      # pytest run above checks the same thing; this prints the table.
      - name: Golden set
        run: uv run python -m golden check

  # The server's tests again, on the database production runs. The app's
  # startup migrates it from empty, so the migrations are exercised too. Each
  # xdist worker gets its own database, made by server/tests/conftest.py.
  server-postgres:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: holt
          POSTGRES_PASSWORD: holt
          POSTGRES_DB: holt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U holt -d holt"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      HOLT_TEST_DATABASE_URL: postgresql+asyncpg://holt:holt@127.0.0.1:5432/holt
      DATABASE_URL: postgresql+asyncpg://holt:holt@127.0.0.1:5432/holt
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --locked

      - name: Migrate an empty database and compare it with the models
        working-directory: server
        run: |
          uv run python -m holt_server.migrate
          uv run python -m holt_server.migrate check

      - name: Server tests
        run: uv run pytest -rs -n auto --durations=15 server/tests
