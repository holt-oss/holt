name: Bug report
description: Report reproducible behavior that is incorrect or unexpected.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Holt. Remove API keys, tokens, and private
        repository data from everything you post. Security vulnerabilities use
        the private process in SECURITY.md.

  - type: input
    id: version
    attributes:
      label: Holt version
      description: Run `holt --version`, or provide the commit hash.
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where did this happen?
      options:
        - Command-line interface
        - Terminal interface
        - Evaluation or reproduction harness
        - Packaging or installation
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Data mode
      description: Select the closest match.
      options:
        - Replay
        - Live with a model
        - Live with --no-model
        - Not applicable or unknown
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact command and the smallest public example that demonstrates the problem.
      placeholder: |
        1. Run ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste redacted output or attach a screenshot when useful.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, terminal, and model provider if relevant.
      placeholder: Ubuntu 24.04, Python 3.12, replay mode
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and pull requests for this problem.
          required: true
        - label: I removed credentials and private repository data from this report.
          required: true
        - label: This is not a privately reportable security vulnerability.
          required: true
