name: Usage question
description: Ask for help using or understanding Holt.
title: "[Question]: "
body:
  - type: markdown
    attributes:
      value: |
        Please check docs/USAGE.md, docs/COMMANDS.md, and existing issues first.
        Remove API keys, tokens, and private repository data before posting.

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include exact redacted commands and the relevant output.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Holt version or commit, operating system, and Python version.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I checked the usage and command documentation.
          required: true
        - label: I removed credentials and private repository data.
          required: true
