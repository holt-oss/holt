[project]
name = "holt-server"
version = "0.1.0"
description = "HTTP API behind the Holt web app. Wraps the holt-cli engine."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "holt-cli",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "cryptography>=43",
    "httpx>=0.27",
]

[project.scripts]
holt-server = "holt_server.main:run"

[tool.uv.sources]
holt-cli = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["holt_server"]
